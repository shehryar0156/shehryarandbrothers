<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="Shehryar &amp; Brothers — stationery and printing shop logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2620"/>
      <stop offset="1" stop-color="#16130f"/>
    </linearGradient>
  </defs>

  <!-- ink tile -->
  <rect x="2" y="2" width="68" height="68" rx="17" fill="url(#tile)"/>
  <rect x="5.5" y="5.5" width="61" height="61" rx="14" fill="none" stroke="#f4ede1" stroke-opacity=".16" stroke-width="2"/>

  <!-- printed sheet with folded corner -->
  <path d="M16 11 H36 L47 22 V50 A6 6 0 0 1 41 56 H16 A6 6 0 0 1 10 50 V17 A6 6 0 0 1 16 11 Z" fill="#fffdf7"/>
  <path d="M36 11 L47 22 H39.5 A2.5 2.5 0 0 1 37 19.5 V11 Z" fill="#c9bda9"/>

  <!-- printed headline + text lines -->
  <rect x="15" y="26" width="24" height="4.2" rx="2.1" fill="#16130f"/>
  <rect x="15" y="33" width="18" height="3.4" rx="1.7" fill="#16130f" opacity=".7"/>
  <rect x="15" y="39.6" width="22" height="3.4" rx="1.7" fill="#16130f" opacity=".45"/>

  <!-- CMYK press colour bar -->
  <rect x="15" y="46" width="5.6" height="5" rx="1.2" fill="#00a6e2"/>
  <rect x="21.4" y="46" width="5.6" height="5" rx="1.2" fill="#e5187f"/>
  <rect x="27.8" y="46" width="5.6" height="5" rx="1.2" fill="#ffc72c"/>
  <rect x="34.2" y="46" width="5.6" height="5" rx="1.2" fill="#45403a"/>

  <!-- pen nib: stationery + writing -->
  <g transform="translate(55.5,31) rotate(-16)">
    <path d="M0 -16 C6.5 -9 8.5 0 0 16.5 C-8.5 0 -6.5 -9 0 -16 Z" fill="#f4ede1"/>
    <circle cx="0" cy="-7" r="2.7" fill="#16130f"/>
    <path d="M0 -3.5 V13" stroke="#16130f" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- registration crosshair -->
  <g stroke="#f4ede1" stroke-opacity=".5" stroke-width="1" fill="none">
    <circle cx="57" cy="57" r="4"/>
    <path d="M57 51.5 V62.5 M51.5 57 H62.5"/>
  </g>
  <circle cx="57" cy="57" r="1.4" fill="#ffc72c"/>
</svg>
