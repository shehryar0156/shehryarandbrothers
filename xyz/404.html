<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found | Shehryar &amp; Brothers</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16130f;
      --paper: #f4ede1;
      --paper-2: #fffdf7;
      --yellow: #ffc72c;
      --magenta: #e5187f;
      --cyan: #00a6e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px 18px;
      background-color: var(--ink);
      background-image:
        radial-gradient(900px 520px at 78% -10%, rgba(0, 166, 226, .28), transparent 58%),
        radial-gradient(760px 480px at 6% 112%, rgba(229, 24, 127, .24), transparent 56%);
      color: var(--paper);
      font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: var(--paper-2);
      color: var(--ink);
      border: 4px solid var(--ink);
      border-radius: 14px;
      box-shadow: 10px 10px 0 rgba(0, 0, 0, .45);
      padding: 44px 28px 40px;
    }
    .mark { width: 92px; height: auto; margin: 0 auto 18px; }
    .code {
      font-family: "Bricolage Grotesque", "Arial Black", sans-serif;
      font-weight: 800;
      font-size: clamp(72px, 18vw, 132px);
      line-height: .95;
      margin: 0 0 6px;
      letter-spacing: -.04em;
    }
    .code span:nth-child(2) { color: var(--magenta); }
    .bar {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 14px auto 22px;
    }
    .bar i { display: block; width: 44px; height: 10px; border-radius: 3px; }
    .bar i:nth-child(1) { background: var(--cyan); }
    .bar i:nth-child(2) { background: var(--magenta); }
    .bar i:nth-child(3) { background: var(--yellow); }
    .bar i:nth-child(4) { background: var(--ink); }
    h1 {
      font-family: "Bricolage Grotesque", "Arial Black", sans-serif;
      font-size: clamp(20px, 4.6vw, 27px);
      margin: 0 0 10px;
    }
    p { margin: 0 auto 26px; max-width: 44ch; line-height: 1.7; font-size: 15px; color: #4a4238; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      color: var(--ink);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translate(-3px, -3px); box-shadow: 5px 5px 0 var(--ink); }
    .btn-home { background: var(--yellow); }
    .btn-wa { background: var(--cyan); }
    .small { margin-top: 26px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #8a7f70; }
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="logo-mark.svg" alt="Shehryar &amp; Brothers logo" width="92" height="92">
    <div class="code"><span>4</span><span>0</span><span>4</span></div>
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>This Page Never Made It To Print!</h1>
    <p>
      The page you were looking for does not exist (or has been removed).
      Use the buttons below to go back home.
    </p>
    <div class="actions">
      <a class="btn btn-home" href="index.html">Go to Home</a>
      <a class="btn btn-wa" href="https://wa.me/923011808840?text=Hello%20Shehryar%20Bhai,%20I%20would%20like%20to%20place%20an%20order" target="_blank" rel="noopener">WhatsApp Order</a>
    </div>
    <div class="small">Shehryar &amp; Brothers - Stationery &amp; Printing</div>
  </main>
</body>
</html>
