<!doctype html>
<html><head><meta charset="utf-8"><title>mf</title>
<style>html,body{margin:0;padding:0;background:#ddd}iframe{width:768px;height:980px;border:0;display:block}pre{margin:0;font:11px monospace;background:#fff;white-space:pre-wrap}</style>
</head><body>
<iframe src="contact.html"></iframe>
<pre id="mdiag">pending</pre>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var f = document.querySelector('iframe');
    var d = f.contentDocument;
    var L = [];
    var vw = d.documentElement.clientWidth;
    L.push('vw=' + vw);
    L.push('scrollW=' + d.documentElement.scrollWidth);
    var scrollers = [], clipped = [];
    var all = d.querySelectorAll('body *');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.closest && el.closest('.ticker, .skip-link, .nav-menu, .nav-overlay, .lightbox')) continue;
      var cs = f.contentWindow.getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') continue;
      var r = el.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;
      if (r.right > vw + 1.5 || r.left < -1.5) {
        var clippedBy = false;
        var p = el.parentElement;
        while (p && p !== d.body) {
          var pcs = f.contentWindow.getComputedStyle(p);
          if (pcs.overflowX === 'hidden' || pcs.overflowX === 'clip') { clippedBy = true; break; }
          p = p.parentElement;
        }
        var tag = el.tagName + '.' + (el.className || '') + ' L' + Math.round(r.left) + ' R' + Math.round(r.right) + ' W' + Math.round(r.width) + ' [' + (el.textContent || '').replace(/\s+/g, ' ').slice(0, 22) + ']';
        if (clippedBy) clipped.push(tag); else scrollers.push(tag);
      }
    }
    L.push('scrollOverflow=' + scrollers.length);
    for (var s = 0; s < Math.min(scrollers.length, 10); s++) L.push('SCROLL ' + scrollers[s]);
    L.push('clippedOverflow=' + clipped.length);
    for (var c = 0; c < Math.min(clipped.length, 10); c++) L.push('CLIP ' + clipped[c]);
    var imgs = d.querySelectorAll('img');
    var broken = 0, pending = 0, zero = 0, lb = 0;
    for (var k = 0; k < imgs.length; k++) {
      var im = imgs[k];
      if (im.closest('.lightbox')) { lb++; continue; }
      if (im.complete) { if (im.naturalWidth === 0) broken++; } else { pending++; }
      var rr = im.getBoundingClientRect();
      if (rr.width < 2 || rr.height < 2) zero++;
    }
    L.push('imgs=' + imgs.length + ' real=' + (imgs.length - lb) + ' broken=' + broken + ' pending=' + pending + ' zeroSize=' + zero);
    L.push('wallTiles=' + d.querySelectorAll('.item-tile').length + ' itemThumbs=' + d.querySelectorAll('.item-thumb').length + ' letterTiles=' + d.querySelectorAll('.item-thumb-none').length);
    L.push('htmlClass=[' + d.documentElement.className + ']');
    L.push('revealDone=' + d.querySelectorAll('.reveal.is-visible').length + '/' + d.querySelectorAll('.reveal').length);
    var head = 'MDI' + 'AG' + ['|'];
    document.getElementById('mdiag').textContent = head + L.join(' @@ ') + ' @@ FIN';
  }, 1600);
});
</script>
</body>
